repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory mcp ruff check --fix
        language: system
        files: ^mcp/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory mcp ruff format
        language: system
        files: ^mcp/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory mcp mypy
        language: system
        files: ^mcp/.*\.py$
        pass_filenames: false
      - id: biome
        name: biome
        entry: npx biome check --write
        language: system
        files: \.(ts|tsx|json)$
        exclude: ^(mcp|deploy)/
        pass_filenames: false
