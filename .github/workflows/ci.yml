name: CI

on:
  push:
    branches: [main, dev, prod]
  pull_request:

jobs:
  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zap
          POSTGRES_PASSWORD: zap
          POSTGRES_DB: zap_kite_mcp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZAP_KITE_MCP_TEST_DATABASE_URL: postgresql://zap:zap@localhost:5432/zap_kite_mcp_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run plugin:openai:test
      - run: npm run plugin:openai:build
      - run: npm run build
