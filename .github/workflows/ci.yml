name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zap
          POSTGRES_PASSWORD: zap
          POSTGRES_DB: zap_kite_mcp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ZAP_KITE_MCP_TEST_DATABASE_URL: postgresql://zap:zap@localhost:5432/zap_kite_mcp_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
