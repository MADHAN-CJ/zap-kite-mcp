# Paste into the server block of the public site. The service listens on 127.0.0.1:8019 and
# expects ZAP_KITE_MCP_PUBLIC_URL=https://<host>/zap-kite-mcp/v1.
location /zap-kite-mcp/v1/ {
    proxy_pass http://127.0.0.1:8019/;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8019;
    proxy_set_header Origin "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 1m;
}

# RFC 8414 / RFC 9728 discovery for a path-scoped issuer: clients look these up at the host root.
location = /.well-known/oauth-authorization-server/zap-kite-mcp/v1 {
    proxy_pass http://127.0.0.1:8019/.well-known/oauth-authorization-server;
    proxy_set_header Host 127.0.0.1:8019;
}
location = /.well-known/oauth-protected-resource/zap-kite-mcp/v1/mcp {
    proxy_pass http://127.0.0.1:8019/.well-known/oauth-protected-resource/mcp;
    proxy_set_header Host 127.0.0.1:8019;
}
location = /.well-known/openid-configuration/zap-kite-mcp/v1 {
    proxy_pass http://127.0.0.1:8019/.well-known/oauth-authorization-server;
    proxy_set_header Host 127.0.0.1:8019;
}
