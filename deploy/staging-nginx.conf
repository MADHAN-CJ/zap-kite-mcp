# Dedicated staging MCP host. Keep the existing UAT site during migration.
# Bootstrap HTTP first, issue the certificate with certbot --nginx, then enable TLS.
server {
    listen 80;
    server_name staging-kite-mcp.slash.markets;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name staging-kite-mcp.slash.markets;
    ssl_certificate /etc/letsencrypt/live/staging-kite-mcp.slash.markets/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-kite-mcp.slash.markets/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1m;
    }
}
